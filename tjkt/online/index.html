<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pemilihan Online Prodi TJKT</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header class="app-header"><div class="header-inner"><div class="brand-section"><div class="logos-group"><img src="/images/yasbam.jpg" alt="Logo SMK Yasbam" class="brand-logo"><img src="/images/tjkt.jpg" alt="Logo TJKT" class="brand-logo"></div><div class="brand-text"><h1>PEMILIHAN ONLINE PRODI TJKT</h1><p>SMKS YASBAM KOTA BOGOR</p></div></div><a href="/statistik.html" class="btn-secondary" style="text-decoration:none">Lihat Statistik</a></div></header>
<main class="main-content"><div style="max-width:1100px;margin:2rem auto;padding:1rem;width:100%"><section id="loginView" class="admin-card" style="max-width:480px;margin:3rem auto;padding:2rem;border-radius:16px;box-shadow:var(--shadow-lg)"><div style="text-align:center;margin-bottom:1.5rem"><div style="font-size:2.5rem">🗳️</div><h2 style="color:var(--color-primary);margin:.5rem 0">Login Pemilih Online</h2><p style="color:var(--color-text-muted)">Masukkan ID atau username dan password dari panitia.</p></div><label for="username" style="display:block;font-weight:600;margin-bottom:.35rem">ID / Username</label><input id="username" placeholder="Contoh: 000000001 atau andi" autocomplete="username" style="width:100%;padding:.75rem;margin-bottom:1rem;border:1px solid var(--color-border);border-radius:8px"><label for="password" style="display:block;font-weight:600;margin-bottom:.35rem">Password</label><input id="password" type="password" placeholder="Masukkan password" autocomplete="current-password" style="width:100%;padding:.75rem;margin-bottom:1rem;border:1px solid var(--color-border);border-radius:8px"><button id="loginButton" class="btn-primary" style="width:100%;padding:.8rem">Masuk dan Lanjut Memilih</button><p id="loginMessage" role="alert" style="min-height:1.5rem;margin-top:1rem;text-align:center;color:var(--color-danger)"></p></section><section id="voteView" style="display:none"><h2 style="color:var(--color-primary)">Silakan Pilih Pasangan Calon</h2><p id="voteMessage" role="status" style="margin:1rem 0;font-weight:600"></p><div id="candidateList" class="candidate-grid"></div></section></div></main><script src="/online/online.js"></script></body></html>
