<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pemilihan Online - SMKS Yasbam</title><link rel="stylesheet" href="/css/style.css">
  <style>
    .online-shell{max-width:560px;margin:0 auto;width:100%}.online-card{background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:1.25rem;box-shadow:var(--shadow-md)}
    .online-step{display:none}.online-step.active{display:block}.online-results{margin-top:.75rem;display:grid;gap:.5rem}.online-user{display:flex;justify-content:space-between;align-items:center;width:100%;padding:.75rem;border:1px solid var(--color-border);border-radius:var(--radius-md);background:#fff;text-align:left}.online-user small{color:var(--color-text-muted)}
  </style>
</head>
<body>
  <header class="app-header"><div class="header-inner"><div class="brand-section"><div class="logos-group"><img src="/images/yasbam.jpg" alt="Logo SMK Yasbam" class="brand-logo"><img src="/images/tjkt.jpg" alt="Logo TJKT" class="brand-logo"></div><div class="brand-text"><h1>PEMILIHAN ONLINE</h1><p>SMKS YASBAM KOTA BOGOR</p></div></div><a href="/statistik.html" class="btn-secondary" style="text-decoration:none">Statistik</a></div></header>
  <main class="main-content"><div class="online-shell"><section class="online-card"><div style="text-align:center;margin-bottom:1.25rem"><div style="font-size:2.25rem">🗳️</div><h2 style="color:var(--color-primary)">Pemilih Online</h2><p style="color:var(--color-text-muted)">Cari nama berdasarkan jurusan dan kelas.</p></div>
    <div id="searchStep" class="online-step active"><label for="majorSelect">Jurusan</label><select id="majorSelect" class="form-control" style="width:100%;margin:.35rem 0 1rem"><option value="">Pilih jurusan</option><option value="TJKT">TJKT</option><option value="MPLB">MPLB</option><option value="TO">TO</option></select><label for="classSelect">Kelas</label><select id="classSelect" class="form-control" style="width:100%;margin:.35rem 0 1rem"><option value="">Pilih kelas</option><option value="12A">12A</option><option value="12B">12B</option></select><label for="searchInput">Cari nama / username</label><input id="searchInput" class="form-control" autocomplete="off" placeholder="Ketik nama atau username" style="width:100%;margin:.35rem 0"><div id="searchResults" class="online-results"></div><p id="searchMessage" role="alert" style="min-height:1.4rem;margin-top:.75rem;color:var(--color-danger)"></p></div>
    <div id="passwordStep" class="online-step"><button id="backToSearch" class="btn-secondary" type="button">← Ganti pemilih</button><p id="selectedUser" style="margin:1rem 0;font-weight:700;color:var(--color-primary)"></p><label for="passwordInput">Password</label><input id="passwordInput" type="password" class="form-control" autocomplete="current-password" placeholder="Masukkan password" style="width:100%;margin:.35rem 0"><button id="loginButton" class="btn-primary" type="button" style="width:100%;margin-top:.75rem">Masuk dan Lanjut Memilih</button><p id="loginMessage" role="alert" style="min-height:1.4rem;margin-top:.75rem;color:var(--color-danger)"></p></div>
    <div id="voteStep" class="online-step"><p id="voteMessage" role="status" style="font-weight:600;margin-bottom:1rem"></p><div id="candidateList" class="candidate-grid"></div></div>
  </section></div></main><footer class="site-copyright">Copyright @tjkt_smkyasbam · Created by Reihan</footer><script src="/online/online.js"></script>
</body></html>
